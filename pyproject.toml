[project]
name = "trainbench"
version = "0.1.0"
description = "Embedding training speed benchmark across Qwen3-VL-Embedding-2B, Qwen3.5-0.8B, and gemma-4-E2B"
readme = "README.md"
# Upper bound pins resolution to 3.13: torch ships cp314 wheels but the training
# frameworks under test do not all support 3.14 yet.
requires-python = ">=3.13,<3.14"
# Every framework env installs this package by path, so anything pinned here is
# imposed on all of them. Bounds are therefore the loosest that still work — only
# what config/device/seed/record actually call. Tight core bounds were measured to
# break three of five envs on their own:
#   torch>=2.13            -> unsloth needs torch<2.12
#   huggingface-hub>=1.26  -> axolotl pins huggingface-hub==1.17.0 exactly
#   pillow>=12.0           -> ms-swift -> gradio needs pillow<12
# The modelling stack lives in the `native` extra; framework envs let their own
# framework choose it, and the resolved versions are recorded per run.
#   hydra-core             -> pins antlr4==4.9.*, axolotl pins antlr4==4.13.2
# Hydra is a composition tool, and composition happens where experiments are
# defined, not on the pod. Pods receive an already-resolved config JSON, so Hydra
# lives in the `compose` extra and never enters a framework image.
dependencies = [
    "torch>=2.4",
    # The VLM processors under test import torchvision (Qwen3VLVideoProcessor and
    # friends), so image preprocessing fails at load time without it. Version is
    # left to the resolver: torchvision pins its own compatible torch.
    "torchvision>=0.19",
    "huggingface-hub>=0.34",
    "pydantic>=2.7",
    "numpy>=1.26",
    "rich>=13.0",
]

[project.optional-dependencies]
# Local/orchestrator side: composes experiment variants and writes resolved JSON.
compose = ["hydra-core>=1.3"]
native = [
    "transformers>=5.14",
    "datasets>=5.0",
    "accelerate>=1.14",
    "peft>=0.20",
    "pillow>=11.0",
]
# Experiment tracking pulls gradio, which constrains pillow. Kept optional so an
# env that cannot satisfy it still produces results (written as JSON regardless).
tracking = ["trackio>=0.34"]
# Accelerated Hub transfers. Optional because it is a hard version floor on
# huggingface-hub that some frameworks cannot meet.
xet = ["hf-xet>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainbench"]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

# The frameworks under test are deliberately NOT dependency groups here.
# `[tool.uv] conflicts` still forces one shared lockfile, and a shared lock forces
# one version per shared package. Measured consequence: with the frameworks as
# groups, uv backtracked the whole stack (transformers 5.3.0, ms-swift 1.4.0);
# with lower bounds enforced it failed outright, because unsloth 2026.7.x requires
# datasets<4.4.0 while the models under test need datasets>=5.0.
# Each framework therefore gets an independent project + independent lock under
# envs/<framework>/, depending on this package by path. See docs/support-matrix.md.

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
