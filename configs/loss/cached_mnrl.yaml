# GradCache. `axes._split_rows` cuts a batch into `mini_batch`-row pieces, and
# since 2026-08-02 it can cut `pixel_values` too: `scripts/bench.py::Collate`
# records how many images each row put into the batch, and that vector is what says
# where a row's pixels begin. Both configured subsets are MMEB draws with an image
# on nearly every row, so before that this value was refused at `assemble` for every
# run this study is set up to make — GradCache exists to save memory and images are
# most of the memory, so the axis was measurable only on the half of its own subject
# that costs the least.
#
# Still refused: a batch carrying pixels with no such counts, and a dataset whose
# rows nothing can read. Both stop the run rather than splitting by position, which
# would hand one row's pixels to another row.
name: cached_mnrl
temperature: 0.02
# Half of `train.batch_size`, so the batch always cuts into four pieces — a batch of
# N pairs is 2N rows through the model. Pinned to the batch rather than to a size:
# the schema refuses `mini_batch > train.batch_size` (GradCache splits a batch, it
# cannot grow one), so 8 stopped composing when the batch moved to 4.
mini_batch: 2
