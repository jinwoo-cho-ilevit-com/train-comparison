repo_id: jinwoo-cho/mmeb-subset
# Regenerated 2026-08-01 with the schema-checked pipeline. The previous pin
# b750b9c3 is the corrupt subset (defect D1) and is now refused by
# KNOWN_CORRUPT_REVISIONS in scripts/prepare_data.py.
# 2048 rows, 20/20 configs at quota, 0 rows without a query image or positive.
revision: 0cfae3fca21a61525166e81e5fa9fcb3dbad55de
source_repo: MrZilinXiao/MMEB_train_with_image
# 2048 rows drawn proportionally across all 20 MMEB configs with sample_seed 1234.
# Speed and memory are measured on a small fixed sample by design (PLAN.md); what
# has to match the real corpus is the length and image-resolution distribution,
# which is why the draw is proportional and why prepare_data records p50/p95.
subset_rows: 2048
sample_seed: 1234
# Equal to subset_rows: a timing run reads the whole subset. A smaller value makes
# this a small-sample run, and prepare_data then refuses to push the draw.
limit: 2048
max_seq_len: 2048
num_workers: 8
push_subset: false
