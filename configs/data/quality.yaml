# The long quality run (loss curve + MMEB-eval Recall@k) needs a corpus 32x the
# speed subset, so it is its own repo. Sharing one repo_id would mean each
# regeneration deletes the other subset's files: the pinned commit still resolves,
# but the two configs would overwrite each other every time either is rebuilt.
repo_id: jinwoo-cho/mmeb-subset-quality
# 65536 rows, 20/20 configs at quota, 0 rows without a query image or positive,
# 0 images whose pixels do not decode, largest single image positive 0.38% of its
# config — and at this size every image-positive config clears
# MIN_ROWS_FOR_SHARE_GATE, so that figure is one the gate actually evaluated.
# Verified by re-reading this revision off the Hub (`verify_pushed`).
#
# This is a *different draw* from speed.yaml, not the same one read deeper. The
# seed is shared, but `shuffle_buffer(want)` scales with the per-config quota and
# caps at 2000, so speed's smaller quotas produce a smaller buffer and therefore a
# different shuffle in 12 of the 20 configs (measured; the 8 whose buffers both
# reach 2000 do line up). Each draw is proportional to upstream and valid on its
# own — what does not hold is any claim that one contains the other.
revision: bd466a8671f4853dd00a5085a219fdab73fead1a
source_repo: MrZilinXiao/MMEB_train_with_image
# Same upstream commit as speed.yaml; see the note there.
source_revision: 9d0fd31789c12a007442de52fe22509e46e49e7d
subset_rows: 65536
# Same seed as speed.yaml. That makes the draw reproducible, not identical to
# speed's: the shuffle buffer moves with the quota (see the revision note above).
sample_seed: 1234
# null: a quality run reads the whole subset.
limit: null
max_seq_len: 2048
num_workers: 8
push_subset: false
# Same budget as speed.yaml — see trainbench/config_schema.py's DataConfig
# docstring for why this lives per data group and stays identical across both.
max_pixels: 1310720
min_pixels: 4096
# Not measured on *this* corpus: a full-corpus scan here timed out on this host
# ("The read operation timed out" against this revision's first parquet shard,
# 2026-08-03 — image bytes are embedded in every row, and this repo is 32x
# speed's row count). Carried over from speed.yaml's measurement instead of
# guessed: same upstream (source_repo/source_revision above), same two models'
# prompt formats, and a 65536-row draw from the same population is unlikely to
# be *shorter*-tailed than speed's 2048-row draw, so reusing speed's max is a
# floor, not an invention. `trainbench/collate.py`'s own runtime check still
# refuses any row this underestimates. See .plans/notes/lane-pixels.md — this
# corpus's own ceiling is an open question for a host with more bandwidth or a pod.
text_token_ceiling: 285
