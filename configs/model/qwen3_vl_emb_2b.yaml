name: qwen3_vl_emb_2b
hf_id: Qwen/Qwen3-VL-Embedding-2B
arch: qwen3_vl
revision: null
# Official embedding model: sentence_bert_config.json sets add_generation_prompt
# true, and config_sentence_transformers.json sets the default prompt.
add_generation_prompt: true
instruction_prompt: "Represent the user's input."
# tokenizer_config.json declares no padding_side, so transformers' default applies.
padding_side: right
pooling: lasttoken
# Pixel-proportional (min_pixels 4096 .. max_pixels 1310720) with no declared
# token cap, so nothing bounds the measured count here.
max_tokens_per_image: null
