name: gemma4_e2b
hf_id: google/gemma-4-E2B
arch: gemma4
revision: null
# Generative model, no embedding spec.
add_generation_prompt: false
instruction_prompt: null
# tokenizer_config.json: "padding_side": "left". The only one of the three that
# pads left, and therefore the only one exercising that pooling branch.
padding_side: left
pooling: lasttoken
# The pre-trained checkpoint ships no chat_template.jinja and its processor's
# chat_template is None (measured, transformers 5.14.1), so its rows carry no role
# or turn markers. Only `google/gemma-4-E2B-it` ships one. See docs/model-spec.md.
prompt_format: raw
# processor_config.json: max_soft_tokens 280. An upper bound, not a per-image
# count — the processor derives each image's count from its aspect ratio and only
# reaches 280 when the ratio divides evenly (measured: 448x448 -> 256,
# 768x256 -> 252, 960x672 -> 280). See docs/model-spec.md.
max_tokens_per_image: 280
