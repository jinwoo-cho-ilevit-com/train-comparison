revision: 2fc06364715b967f1860aea9cf38778875588b17
# Generative VLM, no embedding spec. add_generation_prompt=true would append
# an assistant <think> scaffold whose last token would become the embedding.
add_generation_prompt: false
instruction_prompt: null
# tokenizer_config.json declares no padding_side, so transformers' default applies.
padding_side: right
# No official embedding spec; last-token matches the other two so what differs
# between models stays the architecture rather than the pooling.
pooling: lasttoken
# chat_template.jinja ships with the repo.
prompt_format: chat_template
