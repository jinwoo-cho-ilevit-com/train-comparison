# Phase 3 pod: the dataloader axis on Qwen3.5-0.8B.
#
# All four settings run here, on one host, so packing/pretokenization overhead is
# not folded into host-to-host variance.
phase: phase3
description: >
  torch dataloader against packed against pretokenized against packed+pretokenized
  on Qwen3.5-0.8B
model: qwen3_5_0_8b
framework: native
run: timing
gpu_type_id: NVIDIA A100-SXM4-80GB
baseline: canonical
axis: dataloader
# Required on every qwen3_5_0_8b pod: transformers binds fla while importing the
# Qwen3.5 modelling module whenever the package, version floor and CUDA are all
# present, so kernel=none (the default every run inherits) is unsatisfiable here.
# Full reasoning: configs/experiment/_baselines.yaml, phase2-loss-qwen3_5_0_8b.yaml.
overrides:
  - kernel=fla
settings:
  torch:
    - dataloader=torch
  torch_packed:
    - dataloader=torch_packed
  torch_pretokenized:
    - dataloader=torch_pretokenized
  torch_packed_pretokenized:
    - dataloader=torch_packed_pretokenized
