# Phase 3 pod: the kernel axis on Qwen3-VL-Embedding-2B. qwen3_vl only.
#
# Not swept on qwen3_5_0_8b: transformers binds fla on that architecture at
# import regardless of config (`axes.FLA_ARCHS`), so kernel=none is unsatisfiable
# there. Declaring an `axis: kernel` manifest on that model would mark
# `AXIS_DECLARED` on the kernel axis, turning every other qwen3_5_0_8b pod's
# pinned `kernel=fla` into a split (`orchestrate.held_constant`) and failing
# `check_axis_not_split` for the whole campaign.
phase: phase3
description: no kernel patch against Liger on Qwen3-VL-Embedding-2B
model: qwen3_vl_emb_2b
framework: native
run: timing
gpu_type_id: NVIDIA A100-SXM4-80GB
baseline: canonical
axis: kernel
settings:
  none:
    - kernel=none
  liger:
    - kernel=liger
