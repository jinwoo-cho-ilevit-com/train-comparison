model: qwen3_vl_emb_2b
framework: native
run: timing
gpu_type_id: NVIDIA A100-SXM4-80GB
baseline: canonical
axis: attn
settings:
  sdpa:
    - attn=sdpa
  fa2:
    - attn=fa2
  flex:
    - attn=flex
