# Phase 3 pod: the freeze axis on Qwen3-VL-Embedding-2B.
#
# Both settings run here, on one host, so freeze overhead is not folded into
# host-to-host variance. Not combined with the peft axis in this manifest: the
# schema refuses an adapter crossed with a freeze axis
# (config_schema._freeze_axes_mean_nothing_under_an_adapter), so this pod leaves
# peft at its inherited default (`full`).
phase: phase3
description: no freeze against vision-tower freeze on Qwen3-VL-Embedding-2B
model: qwen3_vl_emb_2b
framework: native
run: timing
gpu_type_id: NVIDIA A100-SXM4-80GB
baseline: canonical
axis: freeze
settings:
  none:
    - freeze=none
  vision_tower:
    - freeze=vision_tower
