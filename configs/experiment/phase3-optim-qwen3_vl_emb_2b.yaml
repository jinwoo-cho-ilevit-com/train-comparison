# Phase 3 pod: the optimizer axis on Qwen3-VL-Embedding-2B.
#
# All three settings run here, on one host, so optimizer overhead is not folded
# into host-to-host variance.
phase: phase3
description: fused AdamW against 8-bit AdamW against Muon on Qwen3-VL-Embedding-2B
model: qwen3_vl_emb_2b
framework: native
run: timing
gpu_type_id: NVIDIA A100-SXM4-80GB
baseline: canonical
axis: optim
settings:
  adamw_fused:
    - optim=adamw_fused
  adamw_8bit:
    - optim=adamw_8bit
  muon:
    - optim=muon
