# The canonical baseline runs, defined once for the whole campaign.
#
# PLAN.md's multi-pod rule 3: every measuring pod runs one identical setting so
# that host-to-host variance is measured instead of assumed, and a pod deviating
# by more than 3% is thrown out rather than averaged in.
#
# It lives in one file because a baseline copied into every manifest drifts, and a
# baseline that differs per pod says nothing about the pods. Every axis is pinned
# explicitly rather than inherited from `configs/config.yaml`: a baseline that
# moves when a default moves is not a baseline.
#
# Nothing here mentions the pod's own model or framework. The baseline is a fixed
# reference workload, so the same one runs on the gemma-4 pod and the Qwen3-VL pod.

canonical:
  description: >
    Smallest model, no optimisation on any axis. Cheap enough to repeat on every
    pod and sensitive to host CPU and memory bandwidth, which is what it is for.
  overrides:
    - run=timing
    - model=qwen3_5_0_8b
    - framework=native
    - data=speed
    - attn=sdpa
    # Not `none`, and the difference is not cosmetic. transformers binds fla while
    # it imports the Qwen3.5 modelling module whenever the package, the version
    # floor and CUDA are all present (`axes._fla_binding`, mirroring
    # `is_flash_linear_attention_available()`), and every image in `envs/` ships it.
    # So on this architecture there is no such thing as a run without fla, and
    # `kernel=none` would be a label for a model built out of fla's classes.
    # The baseline is a fixed reference workload for comparing hosts, not a point
    # on the kernel axis, so what matters is that every pod runs the same thing —
    # and this is what a Qwen3.5 run on these images actually is (2026-08-02).
    - kernel=fla
    - precision=bf16
    - compile=none
    - optim=adamw_fused
    - loss=mnrl
    - peft=full
    - freeze=none
    - dataloader=torch
    - parallel=single
    - train=default
