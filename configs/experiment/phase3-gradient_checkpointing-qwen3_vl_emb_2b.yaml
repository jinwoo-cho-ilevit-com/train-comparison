# Phase 3 pod: the gradient-checkpointing axis on Qwen3-VL-Embedding-2B.
#
# Declared as the full dotted knob (`train.gradient_checkpointing`), not `train`:
# the `train` group also carries the independent `offload` knob
# (configs/train/default.yaml), and `train` alone would not say which one moved.
phase: phase3
description: no checkpointing against full against selective checkpointing on Qwen3-VL-Embedding-2B
model: qwen3_vl_emb_2b
framework: native
run: timing
gpu_type_id: NVIDIA A100-SXM4-80GB
baseline: canonical
axis: train.gradient_checkpointing
settings:
  none:
    - train.gradient_checkpointing=none
  full:
    - train.gradient_checkpointing=full
  selective:
    - train.gradient_checkpointing=selective
