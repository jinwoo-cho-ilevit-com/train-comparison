# Phase 0 pod: can ms-swift load Qwen3.5-0.8B and run one embedding step?
#
# A combination that does not work is a result, not an accident — Phase 3 reports
# it as unsupported. That verdict is only trustworthy when the pod had everything
# it needed, so this pod carries a real Infisical token and a digest-pinned image.
phase: phase0
description: ms_swift x qwen3_5_0_8b load and forward-pass probe
model: qwen3_5_0_8b
framework: ms_swift
run: probe
gpu_type_id: NVIDIA A100-SXM4-80GB
# A probe answers "does it load", not "how fast". There is no number to compare
# across hosts, so there is no canonical baseline run to compare it against.
baseline: none
# Few rows and a batch no wider than the sample: a probe pays for the model load,
# not for the data.
overrides:
  - data.limit=8
  - train.batch_size=8
  # `kernel=none`, the schema default, is unsatisfiable on this architecture —
  # `_baselines.yaml` carries the reason and the source. A probe is not an enforced
  # purpose, so `axes.patch()` admits it and the mismatch lands on `axes_verified`
  # instead: measured 2026-08-03, that alone failed all six qwen3_5 cells.
  - kernel=fla
