name: build images

# Framework images are built here rather than locally: the target is linux/amd64
# CUDA, and cross-building that from arm64 through QEMU is not viable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - envs/**
      - pyproject.toml
      - uv.lock
      - trainbench/**
      - scripts/**
      - .github/workflows/build-images.yml

env:
  REGISTRY: ghcr.io

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      # The CUDA devel base does not fit next to the runner's preinstalled
      # toolchains; without this the build dies on ENOSPC partway through.
      # The native image is the largest by far — a CUDA 13 devel base plus torch,
      # transformer-engine and the DALI stack — so this reclaims everything the
      # build cannot use rather than the four biggest directories.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}" \
                      /usr/local/.ghcup /usr/share/swift /opt/az \
                      /usr/local/share/powershell
          # Preloaded images the build never pulls from.
          docker image prune --all --force
          df -h /

      - id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/trainbench-base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          # `latest` moves, so it cannot appear in a result. The commit tag is what
          # scripts/orchestrate.py --tag names to get a run back to the image that
          # produced it; orchestrate then resolves that tag to a digest itself.
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Registry cache rather than type=gha: the GitHub Actions cache is capped
          # at 10 GB per repository, and one CUDA devel base plus six framework
          # images with mode=max is far past that. Under the cap the caches evict
          # each other, so builds miss at random and the base layer — the one thing
          # all seven images share — is the most likely eviction. GHCR has no such
          # cap, and we are already pushing there.
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.name.outputs.image }}:buildcache,mode=max

      - name: record digest
        run: |
          echo "base ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"

  frameworks:
    needs: base
    runs-on: ubuntu-latest
    # native compiles four CUDA packages from source and has no build cache to
    # start from, so it is the one job that can run long. An explicit bound fails
    # it legibly instead of letting the 6h default expire on a stuck compile.
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing framework must not cancel the others: an image that cannot be
      # built is a Phase 0 result, and the remaining five still need to exist.
      fail-fast: false
      matrix:
        framework:
          - native
          - unsloth
          - ms-swift
          - sentence-transformers
          - tevatron
          - axolotl
    steps:
      - uses: actions/checkout@v5

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
          df -h /

      # Same lowercasing as the base job. GHCR rejects an uppercase path, so an
      # owner whose login is not already lowercase would fail only here.
      - id: name
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/trainbench-${MATRIX_FRAMEWORK}" \
            >> "$GITHUB_OUTPUT"
        env:
          MATRIX_FRAMEWORK: ${{ matrix.framework }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile.framework
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.image }}@${{ needs.base.outputs.digest }}
            FRAMEWORK=${{ matrix.framework }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.name.outputs.image }}:buildcache,mode=max

      # The 2026-08-01 native failure logged only "the runner has received a
      # shutdown signal", which names no cause: an OOM kill and a full disk look
      # the same from the workflow log. This reports both so the next failure is
      # attributable. A silent report is not evidence of health — if the runner
      # VM itself dies this step never runs at all.
      - name: post-build resources
        if: always()
        run: |
          df -h /
          free -h
          sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory' || \
            echo "no kernel OOM entries"
        continue-on-error: true

      - name: record digest
        run: |
          echo "${MATRIX_FRAMEWORK} ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
