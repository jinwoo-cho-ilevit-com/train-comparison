name: build images

# Framework images are built here rather than locally: the target is linux/amd64
# CUDA, and cross-building that from arm64 through QEMU is not viable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - envs/**
      - pyproject.toml
      - uv.lock
      - trainbench/**
      - scripts/**
      - .github/workflows/build-images.yml

env:
  REGISTRY: ghcr.io

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # The CUDA devel base does not fit next to the runner's preinstalled
      # toolchains; without this the build dies on ENOSPC partway through.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
          df -h /

      - id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/trainbench-base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frameworks:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing framework must not cancel the others: an image that cannot be
      # built is a Phase 0 result, and the remaining five still need to exist.
      fail-fast: false
      matrix:
        framework:
          - native
          - unsloth
          - ms-swift
          - sentence-transformers
          - tevatron
          - axolotl
    steps:
      - uses: actions/checkout@v5

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
          df -h /

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.framework
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.base.outputs.image }}:latest
            FRAMEWORK=${{ matrix.framework }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/trainbench-${{ matrix.framework }}:latest
          cache-from: type=gha,scope=${{ matrix.framework }}
          cache-to: type=gha,mode=max,scope=${{ matrix.framework }}
