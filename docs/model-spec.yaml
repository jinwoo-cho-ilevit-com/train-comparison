# Machine-readable half of docs/model-spec.md.
#
# The prose document explains the decisions; this file is what a check can
# compare. `scripts/audit_plan.py` asserts that every value under `config`
# equals the corresponding field in `configs/model/<name>.yaml`, so flipping one
# of them alone fails the audit instead of silently drifting.
#
# `source` names the repository file the value was read from, or states that it
# is our decision. Values marked as a decision have no upstream to check against;
# values with a repository file can be re-verified with the Hugging Face API.

models:
  qwen3_vl_emb_2b:
    hf_id: Qwen/Qwen3-VL-Embedding-2B
    config:
      add_generation_prompt: true
      instruction_prompt: "Represent the user's input."
      padding_side: right
      pooling: lasttoken
      prompt_format: chat_template
    source:
      add_generation_prompt: sentence_bert_config.json
      instruction_prompt: config_sentence_transformers.json
      # No padding_side key; transformers' default is right.
      padding_side: tokenizer_config.json
      pooling: 1_Pooling/config.json
      prompt_format: chat_template.jinja

  qwen3_5_0_8b:
    hf_id: Qwen/Qwen3.5-0.8B
    config:
      add_generation_prompt: false
      instruction_prompt: null
      padding_side: right
      pooling: lasttoken
      prompt_format: chat_template
    source:
      # decision 2: true would append an assistant <think> scaffold, and its last
      # token would become the embedding.
      add_generation_prompt: decision
      instruction_prompt: decision
      padding_side: tokenizer_config.json
      pooling: decision
      prompt_format: chat_template.jinja

# gemma4_e2b was removed from this table on 2026-08-03, along with
# configs/model/gemma4_e2b.yaml: gemma-4-E2B is excluded from the campaign (full
# finetuning does not fit one A100 80GB — see PLAN.md "gemma-4-E2B 제외"). This
# check compares value-by-value against configs/model/*.yaml, so an entry with no
# surviving config file would fail it rather than document anything. The measured
# spec itself is not lost: docs/model-spec.md keeps the gemma-4-E2B section as
# history, marked excluded-from-campaign.
