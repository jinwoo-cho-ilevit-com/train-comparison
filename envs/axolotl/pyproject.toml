# Independent project + independent lock for the axolotl framework image.
# A shared lock would force one version per shared package across all frameworks;
# see docs/support-matrix.md for the measured failure that led here.
[project]
name = "trainbench-env-axolotl"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "trainbench",
    "axolotl>=0.18",
    # Qwen3.5's Gated DeltaNet path, not an ablation axis. See envs/unsloth.
    # No floor here: axolotl 0.18.0 pins flash-linear-attention==0.4.1 exactly, so
    # `>=0.5` is unsatisfiable and the only way to take 0.5.2 would be to downgrade
    # axolotl itself. This image therefore runs a different GDN kernel version than
    # the other five; docs/support-matrix.md records it as a version confound.
    "flash-linear-attention",
    "causal-conv1d>=1.6",
]

[dependency-groups]
# Installed as the image's first sync pass. Every env declares it so the
# Dockerfile has one code path; envs/native explains what depends on it.
# cffi is here only for this env: see no-build-isolation-package below.
build = ["torch", "setuptools>=77", "packaging", "wheel", "ninja", "cffi>=1.17"]

[tool.uv]
# These images only ever run on linux/CUDA pods. Resolving for the host platform
# would drag in wheels that do not exist there.
environments = ["sys_platform == 'linux'"]
default-groups = ["build"]
# axolotl 0.18.0 pins zstandard==0.22.0 exactly, and that sdist pins
# `cffi==1.16.0` exactly in build-system.requires. cffi 1.16.0 has no cp313 wheel
# and its _cffi_backend.c calls _PyErr_WriteUnraisableMsg(), a private CPython
# symbol that 3.13 removed — so under build isolation it compiles and then fails
# to import, which is the recorded axolotl build failure. Building zstandard
# against the environment's own cffi (2.1.0, resolved via cryptography) sidesteps
# the stale build pin without overriding what axolotl asked for at runtime.
# On CPython, zstandard's cffi backend is optional at runtime but make_cffi.py
# still runs at build time, which is where it died.
no-build-isolation-package = ["zstandard"]

[tool.uv.sources]
trainbench = { path = "../..", editable = true }
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
