# Independent project + independent lock for the tevatron framework image.
# A shared lock would force one version per shared package across all frameworks;
# see docs/support-matrix.md for the measured failure that led here.
[project]
name = "trainbench-env-tevatron"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "trainbench",
    "tevatron @ git+https://github.com/texttron/tevatron.git",
    # tevatron's setup.py declares only transformers+datasets, but
    # retriever/modeling/encoder.py imports peft at module level, so every model
    # load fails. Floor matches trainbench's `native` extra; that extra is not
    # installed here because the framework picks its own modelling stack.
    "peft>=0.20",
    # Qwen3.5's Gated DeltaNet path, not an ablation axis. See envs/unsloth.
    "flash-linear-attention>=0.5",
    "causal-conv1d>=1.6",
]

[dependency-groups]
# Installed as the image's first sync pass. Every env declares it so the
# Dockerfile has one code path; envs/native explains what depends on it.
build = ["torch", "setuptools>=77", "packaging", "wheel", "ninja"]

[tool.uv]
# These images only ever run on linux/CUDA pods. Resolving for the host platform
# would drag in wheels that do not exist there.
environments = ["sys_platform == 'linux'"]
default-groups = ["build"]

[tool.uv.sources]
trainbench = { path = "../..", editable = true }
torch = [{ index = "pytorch-cuda" }]
torchvision = [{ index = "pytorch-cuda" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
